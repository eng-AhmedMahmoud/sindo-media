# www.sindo-media.agency: left Vercel after the 2026-11-13 account pause. The
# container listens on loopback :3192 (docker-compose.prod.yml in
# /home/devya/projects/sindo-media). The apex 301s here via apex-redirect.
# Installed once by scripts/deploy.sh (HTTP only); pending-certs runs certbot
# --nginx once DNS points at this VPS, which adds the 443 block in place.
upstream sindo_media {
    server 127.0.0.1:3192;
    keepalive 16;
}
server {
    listen 80;
    listen [::]:80;
    server_name www.sindo-media.agency;

    location / {
        proxy_pass http://sindo_media;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
